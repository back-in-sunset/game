Name: user.rpc
ListenOn: 0.0.0.0:9001

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: user.rpc

Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3306)/user?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

CacheRedis:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: ""

Salt: DADSFHIASDFPTryzICwd7qnJa

Identity:
  Timeout: 5
  PoolSize: 100000
  BatchSize: 2000

ScyllaDB:
  Hosts:
    - 127.0.0.1
    # - 172.19.0.3
    # - 172.19.0.4
  Keyspace: user
  Timeout: 10
  NumConns: 51
  ReconnectInterval: 5
  Consistency: 4

Telemetry:
  Name: user-rpc
  Endpoint: http://127.0.0.1:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger
